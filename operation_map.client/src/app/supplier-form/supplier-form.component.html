<div>
  <h2>{{ supplierId ? 'Edit' : 'Add' }} Supplier</h2>
  <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="companyName">Company Name *</label>
      <input id="companyName" formControlName="companyName" required>
      <div *ngIf="supplierForm.get('companyName')?.invalid && supplierForm.get('companyName')?.touched">
        Company Name is required.
      </div>
    </div>

    <div>
      <label for="salespersonName">Salesperson Name *</label>
      <input id="salespersonName" formControlName="salespersonName" required>
      <div *ngIf="supplierForm.get('salespersonName')?.invalid && supplierForm.get('salespersonName')?.touched">
        Salesperson Name is required.
      </div>
    </div>

    <div>
      <label for="phone">Phone *</label>
      <input id="phone" formControlName="phone" required>
      <div *ngIf="supplierForm.get('phone')?.invalid && supplierForm.get('phone')?.touched">
        Phone is required.
      </div>
    </div>

    <div>
      <label for="email">Email *</label>
      <input id="email" type="email" formControlName="email" required>
      <div *ngIf="supplierForm.get('email')?.invalid && supplierForm.get('email')?.touched">
        A valid Email is required.
      </div>
    </div>

    <div>
      <label for="address">Address</label>
      <input id="address" formControlName="address">
    </div>

    <button type="submit">{{ supplierId ? 'Update' : 'Add' }} Supplier</button>
  </form>
</div>
